name: Course quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Validate Python course material
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install notebook validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nbformat>=5.10,<6" "ipython>=9,<10"

      - name: Validate course notebooks
        run: python .github/scripts/validate_notebooks.py

      - name: Check Python source syntax
        run: python -m compileall -q .
