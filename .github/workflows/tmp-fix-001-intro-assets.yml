name: Temporary - replace 001 Intro embedded images
on:
  push:
    branches: [chore/001-intro-asset-links]
permissions:
  contents: write
jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/001-intro-asset-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Replace only embedded image data URIs
        run: |
          python - <<'PY'
          import base64, hashlib, io, re
          from pathlib import Path
          from urllib.parse import quote
          from PIL import Image
          root=Path('COURSES/001_Intro'); assets_dir=root/'ASSETS'
          notebooks=[root/'AP_CLASS_001.ipynb',root/'AP_LAB_001.ipynb']
          raw_prefix='https://raw.githubusercontent.com/S-L-A-K-E-R/PYTHON_courses/main/COURSES/001_Intro/ASSETS/'
          rx=re.compile(r'data:image/(?P<kind>[A-Za-z0-9.+-]+);base64,(?P<data>[A-Za-z0-9+/=]+)')
          def pix(blob):
            try:
              with Image.open(io.BytesIO(blob)) as im:
                im=im.convert('RGBA'); return im.size,hashlib.sha256(im.tobytes()).hexdigest()
            except Exception: return None
          assets=[]
          for p in sorted(assets_dir.iterdir()):
            if p.is_file():
              b=p.read_bytes(); assets.append((p,hashlib.sha256(b).hexdigest(),pix(b)))
          total=0
          for nb in notebooks:
            original=nb.read_text(encoding='utf-8'); matches=list(rx.finditer(original)); total+=len(matches)
            print(f'{nb}: {len(matches)} embedded image(s)')
            repl={}; errors=[]
            for i,m in enumerate(matches,1):
              b=base64.b64decode(m.group('data'),validate=True); h=hashlib.sha256(b).hexdigest()
              cand=[a for a in assets if a[1]==h]; method='bytes'
              if not cand:
                s=pix(b); cand=[a for a in assets if s is not None and a[2]==s]; method='pixels'
              if len(cand)!=1:
                s=pix(b); dims=s[0] if s else None
                errors.append(f'#{i}: no unique match type={m.group("kind")} bytes={len(b)} dimensions={dims}')
              else:
                p=cand[0][0]; repl[m.group(0)]=raw_prefix+quote(p.name); print(f'  #{i}: {p.name} ({method})')
            if errors: raise SystemExit('\n'.join(errors))
            updated=original
            for old,new in repl.items(): updated=updated.replace(old,new)
            if rx.search(updated): raise SystemExit(f'Embedded image remains in {nb}')
            if updated!=original: nb.write_text(updated,encoding='utf-8')
          print(f'Replaced {total} embedded image occurrence(s).')
          PY
      - name: Verify diff scope
        run: |
          bad="$(git diff --name-only | grep -Ev '^COURSES/001_Intro/(AP_CLASS_001|AP_LAB_001)\.ipynb$' || true)"
          test -z "$bad" || { echo "Unexpected changed files: $bad"; exit 1; }
          git diff --stat
      - name: Commit notebook link replacements
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COURSES/001_Intro/AP_CLASS_001.ipynb COURSES/001_Intro/AP_LAB_001.ipynb
          git commit -m 'Use repository assets in Intro notebooks'
          git push origin HEAD:chore/001-intro-asset-links
